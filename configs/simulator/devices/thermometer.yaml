device_template:
  name: "温湿度传感器"
  model_id: "sensor_th01"

  data_points:
    - name: temperature
      unit: "°C"
      description: "环境温度"
      pattern:
        type: sine
        amplitude: 5.0
        period: 3600
        offset: 25.0
        phase: 0
        noise: 0.5
      range: [-10, 50]
      precision: 1

    - name: humidity
      unit: "%RH"
      description: "相对湿度"
      pattern:
        type: random_walk
        min: 30.0
        max: 80.0
        step: 0.5
      range: [0, 100]
      precision: 1

    - name: battery
      unit: "%"
      description: "电池电量"
      pattern:
        type: constant_noise
        base: 85.0
        noise_amplitude: 2.0
      range: [0, 100]
      precision: 0

  report_interval: 5s

  metadata:
    manufacturer: "SimuSensor Inc."
    firmware: "v2.1.0"
    protocol_version: "1.0"
